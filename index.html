<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصنع العجمي للمراتب | Elagamy Mattress Factory</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
  html{scroll-behavior:smooth}
  body{font-family:'Cairo',sans-serif;background:#050505;color:#fff}
  .gold{color:#FFD700}
  .btn-gold{background:#FFD700;color:#050505;font-weight:700;transition:.25s}
  .btn-gold:hover{background:#fff;transform:translateY(-2px)}
  .card-img{transition:transform .5s}
  .cat-card:hover .card-img{transform:scale(1.1)}
  .cat-card{border:1px solid rgba(255,215,0,.25);transition:.3s}
  .cat-card:hover{border-color:#FFD700;box-shadow:0 0 30px rgba(255,215,0,.2)}
  #cartSidebar{transition:transform .35s ease}
</style>
</head>
<body>

<!-- Header -->
<header class="sticky top-0 z-40 bg-black/90 backdrop-blur border-b border-yellow-500/30">
  <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3">
    <a href="#" onclick="showView('home');return false;" class="flex items-center gap-3">
      <div class="bg-yellow-400 p-1 rounded-lg"><img src="https://i.ibb.co/FLS7f0ph/9e168d62-fde9-4dd4-aad1-3e5ccb66cc44.jpg" alt="Logo" class="w-10 h-10 object-contain rounded"></div>
      <span class="font-black text-lg gold">مصنع العجمي للمراتب</span>
    </a>
    <div class="flex items-center gap-4">
      <button onclick="showView('admin')" class="text-[10px] text-gray-500 hover:text-yellow-400">تسجيل</button>
      <button onclick="toggleCart()" class="relative text-2xl" aria-label="السلة">
        🛒<span id="cartCount" class="absolute -top-2 -left-2 bg-yellow-400 text-black text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </button>
    </div>
  </div>
</header>

<!-- Home view -->
<main id="view-home">
  <section class="relative h-[85vh] flex items-center justify-center text-center overflow-hidden">
    <img src="https://i.ibb.co/KcnNPvNq/9bb098ca-3990-4941-9c56-0b6993a994f9.jpg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-30">
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-[#050505]"></div>
    <div class="relative px-4">
      <h1 class="text-4xl md:text-7xl font-black mb-6">نوم مريح <span class="gold">يليق بيك</span></h1>
      <p class="text-gray-300 text-lg md:text-xl mb-8">جودة وفخامة من قلب المنصورة، صناعة مصرية بأعلى المعايير</p>
      <button onclick="document.getElementById('categories').scrollIntoView({behavior:'smooth'})" class="btn-gold px-10 py-4 rounded-full text-lg">اكتشف منتجاتنا</button>
    </div>
  </section>

  <section id="categories" class="max-w-6xl mx-auto px-4 py-16">
    <h2 class="text-3xl font-black text-center mb-2">أقسامنا</h2>
    <div class="w-20 h-1 bg-yellow-400 mx-auto mb-10 rounded"></div>
    <div id="categoriesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>

  <section class="max-w-6xl mx-auto px-4 pb-16">
    <div class="rounded-3xl border border-yellow-500/30 p-8 text-center bg-neutral-900/50">
      <h3 class="text-2xl font-black gold mb-4">تواصل معنا</h3>
      <p class="mb-2">📍 الرياض مركز منية النصر المنصورة دقهلية</p>
      <p class="mb-2">✉️ <a href="mailto:msn3elagamy@gmail.com" class="underline">msn3elagamy@gmail.com</a></p>
      <p dir="ltr">📞 +201003555377</p>
    </div>
  </section>
</main>

<!-- Products view -->
<main id="view-products" class="hidden max-w-6xl mx-auto px-4 py-10">
  <button onclick="showView('home')" class="mb-6 text-yellow-400 hover:underline">→ العودة للأقسام</button>
  <h2 id="productsTitle" class="text-3xl font-black mb-8 gold"></h2>
  <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<!-- Admin view -->
<main id="view-admin" class="hidden max-w-md mx-auto px-4 py-16">
  <div class="rounded-3xl border border-yellow-500/40 bg-neutral-900 p-8">
    <h2 class="text-2xl font-black gold text-center mb-6">تسجيل دخول الإدارة</h2>
    <input id="adminEmail" type="email" placeholder="البريد الإلكتروني" dir="ltr" class="w-full mb-4 p-3 rounded-xl bg-black border border-neutral-700 focus:border-yellow-400 outline-none">
    <input id="adminPass" type="password" placeholder="كلمة المرور" dir="ltr" class="w-full mb-4 p-3 rounded-xl bg-black border border-neutral-700 focus:border-yellow-400 outline-none">
    <button onclick="adminLogin()" class="btn-gold w-full py-3 rounded-xl">دخول</button>
    <p id="adminMsg" class="text-center text-sm mt-4"></p>
    <button onclick="showView('home')" class="block mx-auto mt-4 text-sm text-gray-400 hover:text-yellow-400">رجوع للموقع</button>
  </div>
</main>

<footer class="text-center text-gray-500 text-sm py-8 border-t border-neutral-800">
  © <span id="year"></span> مصنع العجمي للمراتب - جميع الحقوق محفوظة
</footer>

<!-- Cart overlay + sidebar -->
<div id="cartOverlay" onclick="toggleCart()" class="fixed inset-0 bg-black/70 z-40 hidden"></div>
<aside id="cartSidebar" class="fixed top-0 left-0 h-full w-full max-w-sm bg-neutral-950 border-r border-yellow-500/40 z-50 flex flex-col -translate-x-full">
  <div class="flex items-center justify-between p-4 border-b border-neutral-800">
    <h3 class="font-black text-xl gold">سلة المشتريات</h3>
    <button onclick="toggleCart()" class="text-2xl">✕</button>
  </div>
  <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  <div class="p-4 border-t border-neutral-800">
    <div class="flex justify-between font-bold text-lg mb-4"><span>الإجمالي</span><span id="cartTotal" class="gold">0 جنيه</span></div>
    <button onclick="checkout()" class="w-full py-3 rounded-xl font-bold text-white" style="background:#25D366">إتمام الطلب عبر واتساب</button>
  </div>
</aside>

<!-- Floating WhatsApp -->
<a href="https://wa.me/201003555377" target="_blank" rel="noopener" aria-label="واتساب"
   class="fixed bottom-5 left-5 z-30 w-14 h-14 rounded-full flex items-center justify-center shadow-xl hover:scale-110 transition" style="background:#25D366">
  <svg viewBox="0 0 32 32" width="30" height="30" fill="#fff"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.4.7 4.7 1.9 6.6L3 29l7.1-2.2c1.8 1 3.8 1.5 5.9 1.5 6.9 0 12.6-5.6 12.6-12.5S22.900 3 16 3zm0 22.900c-1.900 0-3.700-.5-5.300-1.500l-.4-.2-4.200 1.300 1.400-4-.3-.4a10.400 10.400 0 0 1-1.600-5.600C5.600 9.700 10.300 5.100 16 5.100s10.400 4.600 10.400 10.400S21.700 25.900 16 25.900zm5.700-7.800c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.200-.2.300-.8 1-1 1.200-.2.200-.4.200-.7.100-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.300-.2-.3 0-.5.100-.7l.5-.6c.2-.2.200-.3.300-.5.100-.2.100-.4 0-.6-.1-.2-.7-1.700-1-2.300-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.100-.9.400-.3.300-1.200 1.100-1.200 2.800s1.200 3.200 1.400 3.500c.2.200 2.400 3.700 5.800 5.100.8.4 1.500.6 2 .8.8.3 1.600.2 2.200.1.700-.1 1.900-.8 2.200-1.500.3-.7.300-1.400.2-1.500-.1-.1-.3-.2-.6-.4z"/></svg>
</a>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // ---------- Config ----------
  var WA_NUMBER = '201003555377';
  var SUPABASE_URL = 'https://lcmjddknwlbmrtbpfvsr.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_TeSRgTFkPk6zAr0NR6vbeg_8a4qi3_V';
  var IMG = {
    spring: 'https://i.ibb.co/KcnNPvNq/9bb098ca-3990-4941-9c56-0b6993a994f9.jpg',
    medical: 'https://i.ibb.co/ns1ZWLSK/a5cb30da-52a4-4545-a09d-6c6cf6a230a6.jpg',
    takawi: 'https://i.ibb.co/qFB6t55v/90d697b1-d3a3-49c4-adfb-ea2da273129d.jpg',
    logo: 'https://i.ibb.co/FLS7f0ph/9e168d62-fde9-4dd4-aad1-3e5ccb66cc44.jpg'
  };

  // ---------- Hardcoded data ----------
  var categories = [
    { id: 'spring', name: 'المراتب السوست', image: IMG.spring },
    { id: 'medical', name: 'المراتب الطبية', image: IMG.medical },
    { id: 'takawi', name: 'التكاوي', image: IMG.takawi },
    { id: 'pillows', name: 'المخدات', image: IMG.logo },
    { id: 'other', name: 'أخرى', image: IMG.logo }
  ];
  var products = [
    { id: 1, category_id: 'spring', name: 'مرتبة سوست 160 سم', price: 6500, image: IMG.spring },
    { id: 2, category_id: 'spring', name: 'مرتبة سوست 120 سم', price: 4800, image: IMG.spring },
    { id: 3, category_id: 'medical', name: 'مرتبة طبية 160 سم', price: 7200, image: IMG.medical },
    { id: 4, category_id: 'medical', name: 'مرتبة طبية 120 سم', price: 5500, image: IMG.medical },
    { id: 5, category_id: 'takawi', name: 'تكاية', price: 170, image: IMG.takawi },
    { id: 6, category_id: 'takawi', name: 'تكاية مخمل', price: 220, image: IMG.takawi },
    { id: 7, category_id: 'pillows', name: 'مخدة ألياف فاخرة', price: 150, image: IMG.logo },
    { id: 8, category_id: 'other', name: 'واقي مرتبة', price: 350, image: IMG.logo }
  ];
  var cart = [];

  // ---------- Helpers ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) { return Number(n).toLocaleString('ar-EG') + ' جنيه'; }

  // ---------- Views ----------
  window.showView = function (v) {
    ['home', 'products', 'admin'].forEach(function (name) {
      document.getElementById('view-' + name).classList.toggle('hidden', name !== v);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // ---------- Render ----------
  function renderCategories() {
    var grid = document.getElementById('categoriesGrid');
    grid.innerHTML = categories.map(function (c) {
      return '<div class="cat-card rounded-3xl overflow-hidden cursor-pointer bg-neutral-900" onclick="openCategory(\'' + esc(c.id) + '\')">' +
        '<div class="h-56 overflow-hidden"><img src="' + esc(c.image) + '" alt="' + esc(c.name) + '" class="card-img w-full h-full object-cover"></div>' +
        '<div class="p-5 text-center"><h3 class="text-xl font-bold gold">' + esc(c.name) + '</h3></div></div>';
    }).join('');
  }

  window.openCategory = function (id) {
    var cat = categories.filter(function (c) { return String(c.id) === String(id); })[0];
    document.getElementById('productsTitle').textContent = cat ? cat.name : 'المنتجات';
    var list = products.filter(function (p) { return String(p.category_id) === String(id); });
    var grid = document.getElementById('productsGrid');
    if (!list.length) {
      grid.innerHTML = '<p class="text-gray-400 col-span-full text-center py-10">لا توجد منتجات في هذا القسم حالياً</p>';
    } else {
      grid.innerHTML = list.map(function (p) {
        return '<div class="rounded-3xl overflow-hidden bg-neutral-900 border border-yellow-500/20">' +
          '<div class="h-56 overflow-hidden"><img src="' + esc(p.image || IMG.logo) + '" alt="' + esc(p.name) + '" class="w-full h-full object-cover"></div>' +
          '<div class="p-5"><h3 class="font-bold text-lg mb-2">' + esc(p.name) + '</h3>' +
          '<p class="gold font-black text-xl mb-4">' + fmt(p.price) + '</p>' +
          '<button class="btn-gold w-full py-3 rounded-xl" onclick="addToCart(' + Number(p.id) + ')">أضف للسلة</button></div></div>';
      }).join('');
    }
    showView('products');
  };

  // ---------- Cart ----------
  window.toggleCart = function () {
    var sb = document.getElementById('cartSidebar');
    var open = sb.classList.contains('-translate-x-full');
    sb.classList.toggle('-translate-x-full', !open);
    document.getElementById('cartOverlay').classList.toggle('hidden', !open);
  };

  window.addToCart = function (id) {
    var p = products.filter(function (x) { return Number(x.id) === Number(id); })[0];
    if (!p) return;
    var item = cart.filter(function (x) { return Number(x.id) === Number(id); })[0];
    if (item) { item.qty += 1; } else { cart.push({ id: p.id, name: p.name, price: Number(p.price), qty: 1 }); }
    updateCartUI();
    var sb = document.getElementById('cartSidebar');
    if (sb.classList.contains('-translate-x-full')) toggleCart();
  };

  window.removeFromCart = function (id) {
    var item = cart.filter(function (x) { return Number(x.id) === Number(id); })[0];
    if (!item) return;
    if (item.qty > 1) { item.qty -= 1; }
    else { cart = cart.filter(function (x) { return Number(x.id) !== Number(id); }); }
    updateCartUI();
  };

  window.updateCartUI = function () {
    var box = document.getElementById('cartItems');
    var total = 0, count = 0;
    cart.forEach(function (i) { total += i.price * i.qty; count += i.qty; });
    if (!cart.length) {
      box.innerHTML = '<p class="text-center text-gray-500 py-10">السلة فارغة</p>';
    } else {
      box.innerHTML = cart.map(function (i) {
        return '<div class="flex items-center justify-between bg-neutral-900 rounded-2xl p-3">' +
          '<div><p class="font-bold">' + esc(i.name) + '</p><p class="text-sm gold">' + fmt(i.price) + ' × ' + i.qty + '</p></div>' +
          '<button onclick="removeFromCart(' + Number(i.id) + ')" class="text-red-400 hover:text-red-300 text-xl" aria-label="حذف">🗑</button></div>';
      }).join('');
    }
    document.getElementById('cartTotal').textContent = fmt(total);
    document.getElementById('cartCount').textContent = count;
  };

  window.checkout = function () {
    if (!cart.length) { alert('السلة فارغة'); return; }
    var total = 0;
    var lines = cart.map(function (i, idx) {
      total += i.price * i.qty;
      return (idx + 1) + '- ' + i.name + ' | الكمية: ' + i.qty + ' | السعر: ' + (i.price * i.qty) + ' جنيه';
    });
    var msg = 'مرحباً مصنع العجمي للمراتب 👋\nأود طلب المنتجات التالية:\n\n' + lines.join('\n') + '\n\nالإجمالي: ' + total + ' جنيه\n\nبرجاء تأكيد الطلب وتحديد موعد التوصيل.';
    window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
  };

  // ---------- Supabase ----------
  var sb = null;
  try {
    if (window.supabase && window.supabase.createClient) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  } catch (e) { console.warn('Supabase init failed', e); }

  window.adminLogin = async function () {
    var msg = document.getElementById('adminMsg');
    var email = document.getElementById('adminEmail').value.trim();
    var pass = document.getElementById('adminPass').value;
    if (!email || !pass) { msg.className = 'text-center text-sm mt-4 text-red-400'; msg.textContent = 'أدخل البريد وكلمة المرور'; return; }
    if (!sb) { msg.className = 'text-center text-sm mt-4 text-red-400'; msg.textContent = 'تعذر الاتصال بالخادم'; return; }
    msg.className = 'text-center text-sm mt-4 text-gray-300'; msg.textContent = 'جاري الدخول...';
    try {
      var res = await sb.auth.signInWithPassword({ email: email, password: pass });
      if (res.error) { msg.className = 'text-center text-sm mt-4 text-red-400'; msg.textContent = 'بيانات الدخول غير صحيحة'; }
      else { msg.className = 'text-center text-sm mt-4 text-green-400'; msg.textContent = 'تم تسجيل الدخول بنجاح ✓'; }
    } catch (e) {
      msg.className = 'text-center text-sm mt-4 text-red-400'; msg.textContent = 'حدث خطأ، حاول مرة أخرى';
    }
  };

  async function loadFromSupabase() {
    if (!sb) return;
    try {
      var c = await sb.from('categories').select('*');
      if (!c.error && c.data && c.data.length) {
        categories = c.data.map(function (x) {
          return { id: x.id, name: x.name, image: x.image || x.image_url || IMG.logo };
        });
        renderCategories();
      }
      var p = await sb.from('products').select('*');
      if (!p.error && p.data && p.data.length) {
        products = p.data.map(function (x) {
          return { id: x.id, category_id: x.category_id, name: x.name, price: Number(x.price) || 0, image: x.image || x.image_url || IMG.logo };
        });
      }
    } catch (e) { console.warn('Supabase fetch failed, using default data', e); }
  }

  // ---------- Init ----------
  document.getElementById('year').textContent = new Date().getFullYear();
  renderCategories();
  updateCartUI();
  loadFromSupabase();
});
</script>
</body>
</html>
